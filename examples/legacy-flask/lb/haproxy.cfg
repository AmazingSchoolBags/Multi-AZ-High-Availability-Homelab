global
    log stdout format raw local0

defaults
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend flask_http
    mode http
    option httplog
    bind :8080
    default_backend flask_nodes

backend flask_nodes
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server app-a 192.0.2.11:8080 check
    server app-b 198.51.100.11:8080 check
    server app-c 203.0.113.11:8080 check

frontend postgres_tcp
    mode tcp
    option tcplog
    bind :5432
    default_backend postgres_primary

backend postgres_primary
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    default-server on-marked-down shutdown-sessions
    server db-a 192.0.2.12:5432 check port 8008
    server db-b 198.51.100.12:5432 check port 8008
    server db-c 203.0.113.12:5432 check port 8008

frontend vikunja_http
    mode http
    option httplog
    bind :3456
    default_backend vikunja_nodes

backend vikunja_nodes
    mode http
    balance roundrobin
    option httpchk GET /api/v1/info
    http-check expect status 200
    server tasks-a 192.0.2.13:3456 check
    server tasks-b 198.51.100.13:3456 check
    server tasks-c 203.0.113.13:3456 check
