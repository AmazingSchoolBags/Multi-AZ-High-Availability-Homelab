{
  "services": {
    "flask": {
      "image": "${FLASK_IMAGE:?Set an image for the lab Flask application}",
      "restart": "unless-stopped",
      "environment": {
        "NODE_NAME": "${NODE_NAME:-app-example}",
        "AZ_NAME": "${AZ_NAME:-zone-example}"
      },
      "ports": ["${FLASK_BIND_IP:-127.0.0.1}:${FLASK_HOST_PORT:-8080}:${FLASK_CONTAINER_PORT:-8080}"]
    }
  }
}
